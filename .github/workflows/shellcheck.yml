name: Validate Shell Scripts

on:
  push:
    branches:
      - main
    paths:
      - scripts/**/*.sh
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Run ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning
          echo 'No ShellCheck issues found in scripts/.'
